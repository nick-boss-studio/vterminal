name: AI Lab Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-lab-review:
    name: "AI Lab Review - ${{ github.event.repository.name }}"
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login != 'yuichen14' &&
       contains(github.event.comment.body, '@yuichen14'))
    concurrency:
      group: ai-lab-review-pr-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true

    runs-on: [self-hosted, macOS, ARM64, yui]
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Lab Review
        run: vterminal lab-review https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }} --max 900000
